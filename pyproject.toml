[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

# The `factorion-server` wheel players install: the mod server, the model code
# it imports, and the compiled `factorion_rs`. Its version is the release tag's
# (stamped by .github/workflows/release.yml).
[project]
name = "factorion-server"
version = "0.0.0"
description = "Model server for the Factorion Factorio mod: designs factories around your sources and sinks."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # Pinned so the cu126 index (below) can only change torch's CUDA build, not
    # its version: that index carries 2.13.0, which PyPI does not, so an
    # unpinned resolve would put Linux on a torch macOS can't install.
    "torch==2.12.1",
    "numpy",
    "tyro",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/beyarkay/factorion"

[project.scripts]
factorion-server = "factorion_server.server:main"

[dependency-groups]
# Training, CI and visualisation: never imported by the server.
train = [
    "networkx",
    "matplotlib",
    "wandb",
    "runpod",
    "pyyaml",
    "requests",  # ci/github_api.py
]
# Tooling for the pre-commit/pre-push checklist (`uv sync` installs these too).
dev = [
    "ruff==0.11.8",
    "pytest",
    "pytest-timeout",
    "maturin",
    "ty==0.0.19",  # pre-1.0: pin exactly so a ty release can't surprise the pre-push gate
]

[tool.uv]
# Development runs from the checkout (the extension via `maturin develop`), so
# `uv sync` only manages dependencies and never builds the wheel.
# torch resolves from PyPI: CPU-only on macOS, CUDA-capable on Linux (so GPU
# boxes work). CI installs CPU-only torch separately for its smoke tests.
package = false
default-groups = ["train", "dev"]

# PyPI's default torch wheel is the +cu130 build, which bundles a CUDA 13
# runtime and so needs host driver >= 580 — a minority of RunPod hosts, which
# starved the CI GPU pool. cu126 runs on any 12.x driver (>= 525) via CUDA
# minor-version compatibility, at the same torch version. Every GPU in
# ci/config.py's fallback chain is Ampere/Ada (sm_86/sm_89), all covered by
# CUDA 12.6; a Blackwell card would need cu129+.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[tool.ty.environment]
# First-party modules imported flat by their siblings (tests do `import helpers`). These dirs are on sys.path at runtime
# (pytest rootdir insertion / cwd), so mirror them here for ty's module
# resolution. The ci/ package is imported from the repo root, so it needs no
# extra path.
extra-paths = ["tests", "scripts"]

[tool.ruff]
# Existing code has many pre-existing violations in the training script.
# Ignoring rules that are pervasive but low-risk, while keeping rules
# that catch real bugs.
extend-exclude = [
    ".claude",  # local Claude Code state and per-agent worktrees
]
lint.select = ["E", "F", "W"]
lint.ignore = [
    "E501",  # line too long (pervasive in existing code)
    "F541",  # f-string without placeholders (pervasive in debug logging)
    "F841",  # local variable assigned but unused (WIP code)
    "E722",  # bare except (used in image loading fallback)
    "F811",  # redefinition of unused name (duplicate Path import)
    "F401",  # unused import (factorion_rs used at runtime via FFI)
]

[tool.maturin]
manifest-path = "factorion_rs/Cargo.toml"
module-name = "factorion_rs"
features = ["pyo3/extension-module", "pyo3/abi3-py311"]
include = [
    { path = "factorion_server/*.py", format = "wheel" },
    { path = "denoise.py", format = "wheel" },
    { path = "factorion.py", format = "wheel" },
    { path = "sft.py", format = "wheel" },
    { path = "training_config.py", format = "wheel" },
]
