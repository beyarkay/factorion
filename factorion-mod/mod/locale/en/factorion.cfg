[item-name]
factorion-footprint-tool=Factorion footprint tool
factorion-source-tool=Factorion source tool
factorion-sink-tool=Factorion sink tool
factorion-source-belt=Factorion source belt
factorion-sink-belt=Factorion sink belt

[item-description]
factorion-footprint-tool=Click once to stamp the model's fixed 11x11 build region, centered on the chosen tile. Right-click to clear it.
factorion-source-tool=Click a tile inside the region, then choose the item its one-tile source belt provides.
factorion-sink-tool=Click a tile inside the region, then choose the item its one-tile sink belt consumes.
factorion-source-belt=Place and mine it like a normal belt. Click it to choose the supplied item; rotate with R.
factorion-sink-belt=Place and mine it like a normal belt. Click it to choose the consumed item; rotate with R. Its rolling 5-second throughput appears above it.

[entity-name]
factorion-source-belt=Factorion source belt
factorion-sink-belt=Factorion sink belt

[entity-description]
factorion-source-belt=Supplies its configured item on both lanes. Rotate it with R.
factorion-sink-belt=Consumes its configured item when it reaches this tile and displays its rolling 5-second throughput. Rotate it with R.

[controls]
factorion-execute=Factorion: request prediction
factorion-reset=Factorion: clear region and model placements
factorion-give-tools=Factorion: give tools and endpoint belts

[command-help]
model=Load a Factorion checkpoint: /model <path-or-wandb-id>

[mod-setting-name]
factorion-default-item=Factorion default item

[mod-setting-description]
factorion-default-item=Item preselected when opening a new source or sink picker.
