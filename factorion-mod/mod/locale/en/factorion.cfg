[item-name]
factorion-footprint-tool=Factorion footprint tool
factorion-source-belt=Factorion source belt
factorion-sink-belt=Factorion sink belt

[item-description]
factorion-footprint-tool=Click once to stamp the model's square build region (its training grid size), centered on the chosen tile. Right-click to clear it.
factorion-source-belt=Place and mine it like a normal belt. Click it to choose the supplied item; changing it clears the old item from downstream belts. Rotate with R.
factorion-sink-belt=Place and mine it like a normal belt. It consumes every item. Click it to choose which item counts toward its throughput (a moving average over about the last second); rotate with R.

[entity-name]
factorion-source-belt=Factorion source belt
factorion-sink-belt=Factorion sink belt

[entity-description]
factorion-source-belt=Supplies its configured item on both lanes. Changing the item clears the old item from its downstream belt network. Rotate with R.
factorion-sink-belt=Consumes every item that reaches this tile and displays the throughput of its configured item, a moving average over about the last second. Rotate it with R.

[controls]
factorion-execute=Factorion: request prediction
factorion-reset=Factorion: clear region and model placements
factorion-give-tools=Factorion: give tools and endpoint belts
factorion-confirm-dialog=Factorion: confirm endpoint item

[mod-setting-name]
factorion-default-item=Factorion default item
factorion-checkpoint=Factorion checkpoint
factorion-placement-delay=Factorion placement delay (seconds)
factorion-temperature=Factorion sampling temperature
factorion-top-k=Factorion top-k
factorion-top-p=Factorion top-p
factorion-stop-rule=Factorion stop rule
factorion-stop-threshold=Factorion stop threshold
factorion-max-steps=Factorion max steps
factorion-seed=Factorion seed

[mod-setting-description]
factorion-default-item=Item preselected when opening a new source or sink picker.
factorion-checkpoint=W&B run id (e.g. mvbipbr0, or entity/project/id) or a local .pt path on the server's machine. The build region takes the model's grid size.
factorion-placement-delay=Pause after each entity the model places, from 0 to 1 second.
factorion-temperature=1 samples the model's own distribution, as in training; lower is more deterministic and 0 always takes the most likely action. Each prediction gets a fresh random seed, shown in chat when it finishes.
factorion-top-k=Only sample from the k most likely choices for each part of an action (tile, entity, direction, item, underground). 0 turns it off.
factorion-top-p=Only sample from the most likely choices that together hold this much probability. 1 turns it off.
factorion-stop-rule=How the model's "I'm done" head ends a prediction.
factorion-stop-threshold=With the threshold stop rule, stop once the model's done-probability exceeds this.
factorion-max-steps=Most placements per prediction. 0 uses the training episode length (grid width x height).
factorion-seed=0 draws a fresh random seed each prediction; any other value replays that seed exactly.

[string-mod-setting]
factorion-stop-rule-sample=Sample it, as in training
factorion-stop-rule-threshold=Stop above the threshold
factorion-stop-rule-never=Never stop early
