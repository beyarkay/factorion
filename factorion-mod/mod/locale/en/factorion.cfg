[mod-setting-description]
factorion-default-source-item=Item a newly placed source belt supplies until you choose another.
factorion-default-sink-item=Item a newly placed sink belt counts until you choose another.
factorion-sink-smoothing=Time constant of the moving average behind each sink's items/s readout. Smaller reacts faster but jumps around more; a new rate is about 95% shown after three times this.
factorion-checkpoint=W&B run id (e.g. mvbipbr0, or entity/project/id) or a local .pt path on the server's machine. The build region takes the model's grid size.
factorion-placement-mode=Whether the model's entities appear as ghosts for you or your robots to build, or are built immediately.
factorion-placement-delay=Pause after each entity the model places, from 0 to 1 second.
factorion-temperature=1 samples the model's own distribution, as in training; lower is more deterministic and 0 always takes the most likely action. Each prediction gets a fresh random seed, shown in chat when it finishes.
factorion-top-k=Only sample from the k most likely choices for each part of an action (tile, entity, direction, item, underground). 0 turns it off.
factorion-top-p=Only sample from the most likely choices that together hold this much probability. 1 turns it off.
factorion-stop-rule=How the model's "I'm done" head ends a prediction.
factorion-stop-threshold=With the threshold stop rule, stop once the model's done-probability exceeds this.
factorion-max-steps=Most placements per prediction. 0 uses the training episode length (grid width x height).
factorion-seed=0 draws a fresh random seed each prediction; any other value replays that seed exactly.

[string-mod-setting]
factorion-placement-mode-ghost=Place ghosts
factorion-placement-mode-build=Build entities
factorion-stop-rule-sample=Sample it, as in training
factorion-stop-rule-threshold=Stop above the threshold
factorion-stop-rule-never=Never stop early
