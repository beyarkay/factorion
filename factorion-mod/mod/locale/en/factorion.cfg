[item-description]
factorion-planner=Click a tile to choose what the factory makes; its sink belt goes there. Then click a tile for each ingredient's source belt. Paint the tiles the factory may use with the build mask, put a GPU server against the paint or link it with a data cable and press Predict in its window. Right-click to clear.
factorion-data-cable=Links GPU servers to painted areas and to each other, like a circuit wire: click a GPU server, pole or painted tile, then another to join them, and the same two again to separate them. Linked servers predict together. The cable stays in hand from the last pole or server, and reaches as far as a wire from its pole would (9 tiles without one). Right-click a server, pole or tile to remove all its data links.
factorion-source-belt=Marks where an ingredient enters the factory. Belt the item into it; it makes nothing itself. Click it to choose the item the model should expect; rotate with R.
factorion-sink-belt=Marks where the product leaves the factory. Belt its output away; it destroys nothing itself. Click it to choose the item it counts; alt-mode shows its throughput as a moving average (see the smoothing setting).
factorion-mask=Paint the tiles of a region the model may build on; it leaves every unpainted tile alone. A region with no paint is buildable everywhere. Resize the brush as you would for concrete, and mine the paint to erase it.

[entity-name]
factorion-source-belt=Factorion source belt
factorion-sink-belt=Factorion sink belt
factorion-gpu-server=GPU server

[entity-description]
factorion-source-belt=A belt marking where an ingredient enters the factory. Belt its item into it.
factorion-sink-belt=A belt marking where the product leaves the factory. Alt-mode shows the throughput of its item.
factorion-gpu-server=Four H200 GPUs: 0.9 kW idle, 4.5 kW predicting. Servers that touch, share a painted area or are joined by data cable predict together, faster the more there are. Wire it to predict or deconstruct on a circuit condition, and to read its state.

[shortcut-name]
factorion-data-cable=Data cable

