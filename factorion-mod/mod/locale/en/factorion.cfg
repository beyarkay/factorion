[item-description]
factorion-planner=Click a tile to choose what the factory makes; its sink belt goes there. Then click a tile for each ingredient's source belt. Paint the tiles the factory may use with the build mask, put a GPU server against the paint or link it with a data cable and press Predict in its window. Right-click to clear.
factorion-data-cable=Links a GPU server to painted areas it is not touching. Click the GPU server, then any electric poles to hang the cable from, then a painted tile. Each hop reaches as far as a wire from its pole would. Right-click a server, pole or cable end to remove its cables.
factorion-source-belt=Place and mine it like a normal belt. Click it to choose the supplied item; changing it clears the old item from downstream belts. Rotate with R.
factorion-sink-belt=Place and mine it like a normal belt. It consumes every item. Click it to choose which item counts toward its throughput (a moving average; see the smoothing setting); rotate with R.
factorion-mask=Paint the tiles of a region the model may build on; it leaves every unpainted tile alone. A region with no paint is buildable everywhere. Resize the brush as you would for concrete, and mine the paint to erase it.

[entity-name]
factorion-source-belt=Factorion source belt
factorion-sink-belt=Factorion sink belt
factorion-gpu-server=GPU server

[entity-description]
factorion-source-belt=Supplies its configured item on both lanes. Changing the item clears the old item from its downstream belt network. Rotate with R.
factorion-sink-belt=Consumes every item that reaches this tile and displays the throughput of its configured item as a moving average. Rotate it with R.
factorion-gpu-server=Four H200 GPUs drawing 4.5 kW. Predictions need at least one powered server. Click any server to choose the model and its denoising settings, shared by every server.

[shortcut-name]
factorion-data-cable=Data cable

[controls]
factorion-predict=Factorion: predict with the GPU server under the cursor
factorion-confirm-dialog=Factorion: confirm endpoint item

[mod-setting-name]
factorion-default-source-item=Default source item
factorion-default-sink-item=Default sink item
factorion-sink-smoothing=Sink throughput smoothing (seconds)
factorion-placement-mode=Placement mode
factorion-step-delay=Denoising step delay (seconds)

[mod-setting-description]
factorion-default-source-item=Item a newly placed source belt supplies until you choose another.
factorion-default-sink-item=Item a newly placed sink belt counts until you choose another.
factorion-sink-smoothing=Time constant of the moving average behind each sink's items/s readout. Smaller reacts faster but jumps around more; a new rate is about 95% shown after three times this.
factorion-placement-mode=Whether the model's entities appear as ghosts for you or your robots to build, or are built immediately.
factorion-step-delay=Pause after each denoising step is placed, so you can watch the factory emerge from noise, from 0 to 5 seconds.

[string-mod-setting]
factorion-placement-mode-ghost=Place ghosts
factorion-placement-mode-build=Build entities
