[item-name]
factorion-footprint-tool=Factorion footprint tool
factorion-source-belt=Factorion source belt
factorion-sink-belt=Factorion sink belt

[item-description]
factorion-footprint-tool=Click once to stamp the model's fixed 11x11 build region, centered on the chosen tile. Right-click to clear it.
factorion-source-belt=Place and mine it like a normal belt. Click it to choose the supplied item; changing it clears the old item from downstream belts. Rotate with R.
factorion-sink-belt=Place and mine it like a normal belt. It consumes every item. Click it to choose which item counts toward its rolling 5-second throughput; rotate with R.

[entity-name]
factorion-source-belt=Factorion source belt
factorion-sink-belt=Factorion sink belt

[entity-description]
factorion-source-belt=Supplies its configured item on both lanes. Changing the item clears the old item from its downstream belt network. Rotate with R.
factorion-sink-belt=Consumes every item that reaches this tile and displays rolling 5-second throughput for its configured item. Rotate it with R.

[controls]
factorion-execute=Factorion: request prediction
factorion-reset=Factorion: clear region and model placements
factorion-give-tools=Factorion: give tools and endpoint belts
factorion-confirm-dialog=Factorion: confirm endpoint item

[mod-setting-name]
factorion-default-item=Factorion default item

[mod-setting-description]
factorion-default-item=Item preselected when opening a new source or sink picker.
