# EXPERIMENT-TMP: batch_size grid at 2M samples on the 32x32 default.
method: grid
run_cap: 3
metric:
  name: "val/thput@8"
  goal: maximize

parameters:
  num_samples:
    value: 2000000
  batch_size:
    values: [128, 256, 512]

program: sft.py

command:
  - ${env}
  - python
  - ${program}
  - --track
  - ${args}
