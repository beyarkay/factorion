# ci/sweep_sft.yaml — TEMPORARY: measures the best-of-N rollout eval's real GPU
# cost and val/thput against N. Revert to the LR-schedule sweep before merging.
#
# Launched with: /ci sweep sft --pods 3 --gpu-type "NVIDIA RTX A6000"
#
# Every run fine-tunes briefly from oegcww3u (the 100M SFT checkpoint) at a tiny
# LR, so each eval rolls out a production-quality policy (rollout length, hence
# eval cost, depends on the policy) and, at a given seed, all three N score the
# same weights on the same val factories. 300k samples = evals at 100k/200k/300k.
# Read val/rollout_seconds and val/thput per N.

method: grid
run_cap: 9
metric:
  name: "val/thput"
  goal: maximize

parameters:
  eval_best_of:
    values: [1, 4, 8]
  seed:
    values: [1, 2, 3]
  start_from:
    value: oegcww3u
  num_samples:
    value: 300000
  lr:
    value: 1e-5

program: sft.py

# Plain `python`: on a CI pod deps are installed system-wide; locally, run the
# agent under `uv run wandb agent <sweep>` so the venv python is on PATH.
command:
  - ${env}
  - python
  - ${program}
  - --track
  - ${args}
