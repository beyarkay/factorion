# EXPERIMENT-TMP: lr grid at batch 128 at 2M samples on the 32x32 default.
method: grid
run_cap: 2
metric:
  name: "val/thput@8"
  goal: maximize

parameters:
  num_samples:
    value: 2000000
  lr:
    values: [1.0e-3, 2.5e-3]

program: sft.py

command:
  - ${env}
  - python
  - ${program}
  - --track
  - ${args}
