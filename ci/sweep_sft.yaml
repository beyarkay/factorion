# EXPERIMENT-TMP: LR grid at 2M samples on the 32x32 default.
method: grid
run_cap: 4
metric:
  name: "val/thput@8"
  goal: maximize

parameters:
  num_samples:
    value: 2000000
  lr:
    values: [3.0e-4, 7.0e-4, 1.5e-3, 3.0e-3]

program: sft.py

command:
  - ${env}
  - python
  - ${program}
  - --track
  - ${args}
