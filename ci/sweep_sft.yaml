# EXPERIMENT-TMP: noise_repeats grid at lr 1.5e-3 at 2M samples on the 32x32 default.
method: grid
run_cap: 2
metric:
  name: "val/thput@8"
  goal: maximize

parameters:
  num_samples:
    value: 2000000
  noise_repeats:
    values: [2, 4]

program: sft.py

command:
  - ${env}
  - python
  - ${program}
  - --track
  - ${args}
