# ci/sweep_sft.yaml — SFT sweep over the WSD learning-rate schedule.
#
# Launched with: uv run python -m ci sweep sft --ref <commitish>  (or comment /ci sweep sft on a PR)
# Sweep results are reported (ci sweep-report), not auto-applied —
# hyperparameter defaults live in training_config.py and are edited by hand.
#
# Architecture stays at the training_config.py defaults settled by the previous
# round; the only thing moving is the shape of the LR schedule:
#   - warmup_steps: an absolute count, so what wins here transfers unchanged to
#     a run of any length — that is the whole point of the schedule. Ladder
#     rather than a continuous range because it feeds an int field.
#   - cooldown_frac: Hägele et al. report the benefit plateauing near 20% and
#     as little as 5% sufficing on long runs; swept past both ends to check that
#     holds at this scale, where 5M samples is far from LLM-pretraining length.
#   - min_lr_ratio: 0 (decay to zero, as the paper does) is in range, so the
#     sweep can tell us whether a nonzero floor is worth anything here.
#   - lr: the peak the stable phase sits at for most of the run, so it is the
#     single most consequential number in the schedule and cannot be pinned
#     while the phases move. Range is the band the previous round's good runs
#     spanned — but note those were cosine runs, which spend most of their steps
#     well below their peak, so the best peak here may well be lower.
#
# 5M samples (~9.8k steps at batch_size 512) keeps the stable phase dominant, so
# the sweep scores the plateau rather than the anneal.

method: bayes
run_cap: 20
metric:
  name: "val/thput"
  goal: maximize

parameters:
  # Pinned: monotonic in the metric, so Bayes would only saturate them.
  size:
    value: 11
  num_samples:
    value: 5000000
  epochs:
    value: 1
  max_level:
    value: 0  # auto = 2*size = 22 entities blanked

  # ── Warmup ───────────────────────────────────────────────────────
  warmup_steps:
    values: [50, 100, 200, 300, 500, 800, 1200, 2000]

  # ── Cooldown ─────────────────────────────────────────────────────
  cooldown_frac:
    distribution: uniform
    min: 0.02
    max: 0.5
  min_lr_ratio:
    distribution: uniform
    min: 0.0
    max: 0.1

  # ── The peak the stable phase holds ──────────────────────────────
  lr:
    distribution: log_uniform_values
    min: 5e-4
    max: 3e-3

program: sft.py

# Plain `python`: on a CI pod deps are installed system-wide; locally, run the
# agent under `uv run wandb agent <sweep>` so the venv python is on PATH.
command:
  - ${env}
  - python
  - ${program}
  - --track
  - ${args}
