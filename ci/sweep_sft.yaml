# ci/sweep_sft.yaml — SFT sweep at 15x15 on the full-factory lessons.
#
# Launched with: uv run python -m ci sweep sft --ref <commitish>  (or comment /ci sweep sft on a PR)
# Sweep results are reported (ci sweep-report), not auto-applied —
# hyperparameter defaults live in training_config.py and are edited by hand.
#
# Ranges set from sweep eyhka9jz (15 finished runs at this budget; rank
# corr with val/thput in brackets), cut to where its good runs were and
# extended only where they pressed on an edge:
#   - attention depth (+0.73) and width (+0.75): every run under 5 layers or
#     224 dim scored <= 0.077, the top five were 5-6 layers at 224-256. The
#     floor moves up to there; the ceiling extends past the old edge. Bigger
#     models cost wall-clock at fixed samples (the run is GPU-bound) — weigh
#     _runtime when narrowing.
#   - conv width (-0.70): top five all 64-80, every run at >= 112 poor.
#   - ent/misc/eot loss weights (-0.42/-0.72/-0.65): top five all below 1,
#     every run above ~1.4 poor. Relative to the fixed lw_tile, tile selection
#     wants more of the gradient.
#   - max_grad_norm (-0.39): top five 0.28-0.66 against a train grad norm of
#     ~0.8, i.e. clipping every step.
#   - lr (+0.57): nothing below 5e-4 made the top five.
#   - cooldown_frac (+0.32): the best two ran 0.73-0.77, at the old ceiling.
# Pinned at their training_config defaults, which sit inside the good runs'
# spread: batch_size, weight_decay and lw_dir (rank corr -0.04/+0.09/-0.10).
# Also pinned: dropout off (every sample is freshly generated), and
# warmup_steps, min_lr_ratio and head count (no signal in earlier sweeps).
#
# Stage 2: copy the promising region into narrower ranges, num_samples 45M.

method: bayes
run_cap: 40
metric:
  name: "val/thput@8"  # @ training_config eval_best_of
  goal: maximize

parameters:
  size:
    value: 15
  num_samples:
    value: 25000000
  epochs:
    value: 1
  max_level:
    value: 0  # auto = size*size
  # The sweep metric is the final eval alone: 1000 shared val seeds instead of
  # 400 cut its noise ~1.6x, paid for by evaluating a fifth as often.
  eval_rollouts_max_seeds:
    value: 1000
  eval_every_n_samples:
    value: 2500000
  dropout:
    value: 0.0

  # ── Optimisation ─────────────────────────────────────────────────
  lr:
    distribution: log_uniform_values
    min: 4.0e-4
    max: 3.0e-3
  cooldown_frac:
    distribution: uniform
    min: 0.3
    max: 0.95
  max_grad_norm:
    distribution: log_uniform_values
    min: 0.05
    max: 1.0

  # ── Loss weights (lw_tile = 1.162 is the reference) ──────────────
  lw_ent:
    distribution: log_uniform_values
    min: 0.1
    max: 1.0
  lw_misc:
    distribution: log_uniform_values
    min: 0.1
    max: 1.0
  lw_eot:
    distribution: log_uniform_values
    min: 0.1
    max: 1.0

  # ── Architecture ─────────────────────────────────────────────────
  layer1:
    distribution: q_log_uniform_values
    min: 32
    max: 96
    q: 16
  attn_layers:
    distribution: int_uniform
    min: 5
    max: 8
  attn_dim:
    distribution: q_uniform
    min: 224
    max: 320
    q: 32
  # 8 divides every attn_dim above, so heads never snap.
  attn_heads:
    value: 8

program: sft.py

# Plain `python`: on a CI pod deps are installed system-wide; locally, run the
# agent under `uv run wandb agent <sweep>` so the venv python is on PATH.
command:
  - ${env}
  - python
  - ${program}
  - --track
  - ${args}
