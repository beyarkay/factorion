# ci/sweep_sft.yaml — broad SFT sweep at 15x15 on the full-factory lessons.
#
# Launched with: uv run python -m ci sweep sft --ref <commitish>  (or comment /ci sweep sft on a PR)
# Sweep results are reported (ci sweep-report), not auto-applied —
# hyperparameter defaults live in training_config.py and are edited by hand.
#
# Every earlier SFT sweep ran at 11x11 on the old lesson mix; the regularisers,
# loss weights, grad clip and batch size date from the conv-only arch. What the
# 100M/300M runs (oegcww3u, unfs3r0w) say:
#   - Every sample is freshly generated, so there is nothing to overfit:
#     dropout is pinned off. weight_decay stays swept — under AdamW it sets
#     the weight norm (and so the effective step size), not just overfitting.
#   - The cooldown is where most of the gain lands (300M: val/loss 0.229 ->
#     0.196, val/thput ~0.13 -> 0.24) while the stable phase crawls: gradient
#     noise bound, hence lr, batch_size and cooldown_frac.
#   - ent/dir are the error budget (val loss 0.058/0.063 vs item 0.004), so
#     their loss weights move; tile is the fixed reference (Adam makes the
#     overall scale redundant) and item is already solved.
#   - 91w8vyea's best runs sat at the top of its attn_layers and conv-width
#     ranges, so both are extended past them. Bigger models cost wall-clock at
#     fixed samples (the run is GPU-bound) — weigh _runtime when narrowing.
#   - ndc8tvvy found no signal in warmup_steps or min_lr_ratio: left at defaults.
#
# Stage 2: copy the promising region into narrower ranges, num_samples 45M.

method: bayes
run_cap: 60
metric:
  name: "val/thput"
  goal: maximize

parameters:
  size:
    value: 15
  num_samples:
    value: 25000000
  epochs:
    value: 1
  max_level:
    value: 0  # auto = size*size
  # The sweep metric is the final eval alone: 1000 shared val seeds instead of
  # 400 cut its noise ~1.6x, paid for by evaluating a fifth as often.
  eval_rollouts_max_seeds:
    value: 1000
  eval_every_n_samples:
    value: 2500000
  dropout:
    value: 0.0

  # ── Optimisation ─────────────────────────────────────────────────
  lr:
    distribution: log_uniform_values
    min: 1.0e-4
    max: 3.0e-3
  batch_size:
    distribution: q_log_uniform_values
    min: 256
    max: 2048
    q: 128
  cooldown_frac:
    distribution: uniform
    min: 0.1
    max: 0.8
  max_grad_norm:  # train grad norm sits ~0.8, so the low end clips every step
    distribution: log_uniform_values
    min: 0.25
    max: 4.0

  # ── Regularisation ───────────────────────────────────────────────
  weight_decay:
    distribution: log_uniform_values
    min: 1.0e-4
    max: 0.3

  # ── Loss weights (lw_tile = 1.162 is the reference) ──────────────
  lw_ent:
    distribution: log_uniform_values
    min: 0.3
    max: 3.0
  lw_dir:
    distribution: log_uniform_values
    min: 0.3
    max: 3.0
  lw_misc:
    distribution: log_uniform_values
    min: 0.3
    max: 3.0
  lw_eot:
    distribution: log_uniform_values
    min: 0.3
    max: 3.0

  # ── Architecture ─────────────────────────────────────────────────
  layer1:
    distribution: q_log_uniform_values
    min: 64
    max: 256
    q: 16
  attn_layers:
    distribution: int_uniform
    min: 2
    max: 6
  attn_dim:
    distribution: q_uniform
    min: 128
    max: 256
    q: 32
  # No signal in 91w8vyea; 8 divides every attn_dim above, so heads never snap.
  attn_heads:
    value: 8

program: sft.py

# Plain `python`: on a CI pod deps are installed system-wide; locally, run the
# agent under `uv run wandb agent <sweep>` so the venv python is on PATH.
command:
  - ${env}
  - python
  - ${program}
  - --track
  - ${args}
