# ci/sweep_rl.yaml — RL fine-tuning of the denoiser (rl.py)
#
# Launched with: /ci sweep rl
# Sweep results are reported (ci sweep-report), not auto-applied —
# hyperparameter defaults live in training_config.py and are edited by hand.
#
# Before launching, refresh the --start-from base below: check W&B for the
# latest + longest-running denoiser SFT run that uploaded a model artifact. A
# run's eval/ at iteration 0 is its base's own score, so the metric compares
# across runs from the same base.
#
# Ranges bracket #484's hand-tuned defaults:
#   - lr: 1e-3 diverged under the policy gradient; RAFT has only seen 2.5e-4.
#   - groups x group_size: the best of a larger group is a better target
#     (best-of-k was still rising at 32), fewer groups fewer targets.
#   - temperature: 1.5 beat 1.0 on eval/thput@8; 2.0 widened best-of-32
#     further.
#   - sft_coef: 0.3 beat 1.0 on eval/thput@8; 0 hurt eval/thput@1.
#   - entity_cost_scale: 0 rewards throughput alone, which is what eval scores.
#
# 3M timesteps is ~90 optimizer steps at 64 factories x 32 builds, where #484's
# configs had already separated.

method: bayes
run_cap: 25
metric:
  name: "eval/thput@8"  # @ training_config eval_best_of
  goal: maximize

parameters:
  lr:
    distribution: log_uniform_values
    min: 5e-5
    max: 1e-3
  groups:
    values: [32, 64, 128]
  group_size:
    values: [16, 32, 64]
  temperature:
    distribution: uniform
    min: 1.0
    max: 2.0
  sft_coef:
    distribution: log_uniform_values
    min: 0.05
    max: 1.0
  entity_cost_scale:
    values: [0.0, 0.001]

program: rl.py

command:
  - ${env}
  - python
  - ${program}
  - --start-from
  - dr17bmik
  - --total-timesteps
  - 3_000_000
  - --track
  - ${args}
