# ci/sweep_ppo.yaml — PPO finetune of an SFT base: where in the non-collapsing region it improves most.
#
# Launched with: /ci sweep ppo
# Sweep results are reported (ci sweep-report), not auto-applied —
# hyperparameter defaults live in training_config.py and are edited by hand.
#
# Before launching, refresh the --start-from base below: check W&B for the
# latest + longest-running SFT run that uploaded a model artifact (runs
# without one can't be loaded as a base, and beware PR-experiment runs such
# as single-lesson trains — their val/thput@8 is not comparable).
#
# Ranges from the 40-run random screen m5efstjq (500k steps from mvbipbr0).
# No run collapsed. Every run is scored on the same factories and sampling
# noise, so the 8 runs that barely moved (KL to base < 0.006) agree to
# 0.463 ± 0.006, and 9 runs reached 0.485-0.507:
#   - update_epochs (rank corr +0.39): 1 epoch averaged at the base (0.461);
#     4-8 averaged 0.475.
#   - target_kl (+0.33): below 0.005 averaged at the base; >= 0.015 averaged
#     0.476 and holds the best run (0.044).
#   - ent_coef_start (-0.25): 4 of the 5 runs ending > 0.2 nats from the base
#     had >= 0.0045; those 5 scored <= 0.467 with ~12% longer episodes.
#   - learning_rate: no signal alone over 4e-7-9e-5; 7 of the 9 best runs sat
#     at 9e-7-1e-5.
#   - divergence_penalty (+0.18): weak; kept for the longer horizon, where
#     drift grows.
# Pinned: num_steps 256 (no signal, rank corr -0.03) and the screen's short
# warmups. A final eval at 12 factories per lesson, plus one at mid-run so a
# run's trend shows.

method: bayes
run_cap: 30
metric:
  name: "eval/thput@8"  # @ training_config eval_best_of
  goal: maximize

parameters:
  lr_warmup_iters:
    value: 5
  critic_warmup:
    value: 5
  ent_coef_end:
    value: 0.0
  num_steps:
    value: 256
  eval_every:
    value: 122
  eval_seeds_per_kind:
    value: 12

  learning_rate:
    distribution: log_uniform_values
    min: 1.0e-6
    max: 5.0e-5
  update_epochs:
    values: [2, 4, 8]
  target_kl:
    distribution: log_uniform_values
    min: 0.005
    max: 0.05
  divergence_penalty:
    distribution: log_uniform_values
    min: 3.0e-3
    max: 0.3
  ent_coef_start:
    distribution: log_uniform_values
    min: 1.0e-4
    max: 5.0e-3

program: ppo.py

command:
  - ${env}
  - python
  - ${program}
  - --start-from
  - mvbipbr0
  - --total-timesteps
  - 1_000_000
  - --track
  - ${args}
