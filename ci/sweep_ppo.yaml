# ci/sweep_ppo.yaml — isolate the PPO entity-cost penalty strength
# Launched with: /ci sweep ppo

method: grid
run_cap: 10
metric:
  name: "rollout/thput"
  goal: maximize

parameters:
  gamma:
    distribution: uniform
    min: 0.95
    max: 1.0

program: ppo.py

command:
  - ${env}
  - python
  - ${program}
  - --start-from
  - h76h80yb
  - --total-timesteps
  - 2_000_000
  - --track
  - ${args}
