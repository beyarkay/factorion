# ci/sweep_ppo.yaml — PPO finetune of an SFT base: where in the non-collapsing region it improves most.
#
# Launched with: /ci sweep ppo
# Sweep results are reported (ci sweep-report), not auto-applied —
# hyperparameter defaults live in training_config.py and are edited by hand.
#
# Before launching, refresh the --start-from base below: check W&B for the
# latest + longest-running SFT run that uploaded a model artifact (runs
# without one can't be loaded as a base, and beware PR-experiment runs such
# as single-lesson trains — their val/thput@8 is not comparable).
#
# From the 40-run random screen m5efstjq (500k steps from mvbipbr0). No run
# collapsed; the 8 that barely moved agree to 0.463 ± 0.006, and the best
# reached 0.507. A random forest fitted on its final eval/thput@8 and late-run
# rollout/thput says which knobs carry signal: refit without a knob and see
# whether cross-validated R^2 drops (eval / rollout):
#   - target_kl      +0.10 / +0.19  good from ~0.013, still rising at the
#                                   screen's 0.05 ceiling, so the range goes past it
#   - update_epochs  +0.10 / +0.12  good from ~3, still rising at 8
#   - learning_rate  -0.03 / +0.06  peaks at 5e-6-1e-5 on rollout/thput
#   - ent_coef_start, divergence_penalty, num_steps: <= 0 on both, so pinned.
#     The entropy bonus sits in the flat low region its curves favour;
#     divergence_penalty is a moderate anchor for the longer runs.
# The forest explains little (CV R^2 0.1-0.2), so each range stays ~2x wider
# than its good band. Three knobs need fewer runs than six.

method: bayes
run_cap: 24
metric:
  name: "eval/thput@8"  # @ training_config eval_best_of
  goal: maximize

parameters:
  lr_warmup_iters:
    value: 5
  critic_warmup:
    value: 5
  ent_coef_start:
    value: 2.0e-4
  ent_coef_end:
    value: 0.0
  num_steps:
    value: 256
  divergence_penalty:
    value: 0.05
  eval_every:
    value: 122
  eval_seeds_per_kind:
    value: 12

  learning_rate:
    distribution: log_uniform_values
    min: 1.5e-6
    max: 3.0e-5
  update_epochs:
    distribution: int_uniform
    min: 3
    max: 12
  target_kl:
    distribution: log_uniform_values
    min: 0.01
    max: 0.1

program: ppo.py

command:
  - ${env}
  - python
  - ${program}
  - --start-from
  - mvbipbr0
  - --total-timesteps
  - 1_000_000
  - --track
  - ${args}
