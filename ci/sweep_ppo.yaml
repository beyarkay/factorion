# ci/sweep_ppo.yaml — β for the KL-to-SFT-reference penalty (#237)
#
# Launched with: /ci sweep ppo
#
# Every run finetunes the canonical SFT base for 5M steps. β is a scale
# parameter, so it is searched log-continuously: the 0.001 floor makes the
# penalty term ~30x smaller than the policy-gradient loss even at full
# drift (an effective no-penalty control), the 0.2 ceiling is 2x the
# strength already measured to over-anchor. seed is a nuisance categorical
# so the optimum must hold across seeds rather than chase one lucky one.

method: bayes
run_cap: 18
metric:
  name: "eval/thput"
  goal: maximize

parameters:
  divergence_penalty:
    distribution: log_uniform_values
    min: 0.001
    max: 0.2
  seed:
    values:
      - 0
      - 1
      - 2

program: ppo.py

command:
  - ${env}
  - python
  - ${program}
  - --start-from
  - h76h80yb
  - --total-timesteps
  - 5_000_000
  - --track
  - ${args}
