# ci/sweep_ppo.yaml — wide, short screen for PPO settings that don't collapse the SFT base.
#
# Launched with: /ci sweep ppo
# Sweep results are reported (ci sweep-report), not auto-applied —
# hyperparameter defaults live in training_config.py and are edited by hand.
#
# Before launching, refresh the --start-from base below: check W&B for the
# latest + longest-running SFT run that uploaded a model artifact (runs
# without one can't be loaded as a base, and beware PR-experiment runs such
# as single-lesson trains — their val/thput@8 is not comparable).
#
# At the training_config defaults PPO destroys the base (run 6etby4zk:
# eval/thput 0.43 -> 0.03 over 1M steps, almost all of it tile-head drift).
# Rollout and update log-probs agree exactly (approx_kl == 0 while the actor
# is frozen), so this screens step size and batch noise, not a bug:
#   - learning_rate: lr 1e-5 already hits target_kl 0.02 on the second joint
#     iteration, so the range reaches far below the default.
#   - update_epochs, target_kl: the rest of how far one batch moves the policy.
#   - divergence_penalty: up to 1, where the KL anchor dominates the PG loss.
#   - ent_coef_start: the bonus spans ~225 tile choices; annealed to 0.
#   - num_steps: episodes run ~150 steps, so 256 x 16 envs holds only ~25
#     episodes per update; 1024 holds ~100.
# Warmups are pinned short in iterations so every batch size gets the same
# steps of joint training. The metric is one final eval at 12 factories per
# lesson (standard error ~0.03); a run that holds the base's val/thput@8
# (0.53 for mvbipbr0) didn't collapse.
#
# Stage 2: narrow to the non-collapsing region, longer runs, bayes.

method: random
run_cap: 40
metric:
  name: "eval/thput@8"  # @ training_config eval_best_of
  goal: maximize

parameters:
  lr_warmup_iters:
    value: 5
  critic_warmup:
    value: 5
  ent_coef_end:
    value: 0.0
  eval_every:
    value: 1000
  eval_seeds_per_kind:
    value: 12

  learning_rate:
    distribution: log_uniform_values
    min: 3.0e-7
    max: 1.0e-4
  update_epochs:
    values: [1, 2, 4, 8]
  target_kl:
    distribution: log_uniform_values
    min: 0.001
    max: 0.05
  divergence_penalty:
    distribution: log_uniform_values
    min: 1.0e-3
    max: 1.0
  ent_coef_start:
    distribution: log_uniform_values
    min: 1.0e-4
    max: 3.0e-2
  num_steps:
    values: [256, 1024]

program: ppo.py

command:
  - ${env}
  - python
  - ${program}
  - --start-from
  - mvbipbr0
  - --total-timesteps
  - 500_000
  - --track
  - ${args}
