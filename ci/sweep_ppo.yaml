# ci/sweep_ppo.yaml — PPO finetune of an SFT base at 15x15 on the full-factory lessons.
#
# Launched with: /ci sweep ppo
# Sweep results are reported (ci sweep-report), not auto-applied —
# hyperparameter defaults live in training_config.py and are edited by hand.
#
# Before launching, refresh the --start-from base below: check W&B for the
# latest + longest-running SFT run that uploaded a model artifact (runs
# without one can't be loaded as a base, and beware PR-experiment runs such
# as single-lesson trains — their val/thput@8 is not comparable).
#
# Every PPO default predates the 8x288 attention policy (#469), so the knobs
# that set how far and how fast the policy moves off its SFT base are
# re-centred on their defaults, each range a little wider than its plausible
# good band:
#   - learning_rate / critic_lr: the actor and critic peaks. Sweep 663awt86
#     put the critic's 13x below the actor's, near the bottom of its range.
#   - target_kl: caps each update's policy step, so it trades off against
#     learning_rate (high lr + low target_kl just early-stops sooner).
#   - divergence_penalty: the KL anchor to the SFT base (#425's sweep pointed
#     near 0.002, the default is 0.008).
#   - ent_coef_start/end: exploration, which the trials depend on (#373, #376).
#   - max_grad_norm: the same network clipped every step in SFT (0.33); the
#     PPO default 1.22 was tuned on the old conv-only trunk.
# Pinned at their training_config defaults: gamma (0.997, fixed with the
# reward in #400), gae_lambda, clip_coef, num_minibatches, update_epochs,
# vf_coef (sweep llfgwhki's picks for these gained nothing in #346's
# compare), the LR envelope shape (663awt86 swept it; shape transfers
# across models better than peaks), critic_warmup, and entity_cost_scale (it
# defines the reward, so it isn't tuned against eval/thput@8).
#
# The sweep metric is the final eval alone: 24 held-out factories per lesson
# instead of 12 cut its noise ~1.4x, paid for by evaluating half as often.
# 1M timesteps ≈ 244 iterations.
#
# Stage 2: copy the promising region into narrower ranges at a longer budget.

method: bayes
run_cap: 30
metric:
  name: "eval/thput@8"  # @ training_config eval_best_of
  goal: maximize

parameters:
  eval_seeds_per_kind:
    value: 24
  eval_every:
    value: 14

  # ── Peaks ────────────────────────────────────────────────────────
  learning_rate:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 2.0e-4
  critic_lr:
    distribution: log_uniform_values
    min: 1.0e-6
    max: 1.0e-4

  # ── Step size / anchoring ────────────────────────────────────────
  target_kl:
    distribution: log_uniform_values
    min: 0.005
    max: 0.05
  divergence_penalty:
    distribution: log_uniform_values
    min: 1.0e-3
    max: 5.0e-2
  max_grad_norm:
    distribution: log_uniform_values
    min: 0.2
    max: 3.0

  # ── Exploration ──────────────────────────────────────────────────
  ent_coef_start:
    distribution: log_uniform_values
    min: 1.0e-3
    max: 3.0e-2
  # Capped at ent_coef_start's floor so the anneal never rises.
  ent_coef_end:
    distribution: log_uniform_values
    min: 1.0e-4
    max: 1.0e-3

program: ppo.py

command:
  - ${env}
  - python
  - ${program}
  - --start-from
  - 8gqpfppb
  - --total-timesteps
  - 1_000_000
  - --track
  - ${args}
