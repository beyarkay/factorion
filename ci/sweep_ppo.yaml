# ci/sweep_ppo.yaml — β for the KL-to-SFT-reference penalty (#237)
#
# Launched with: /ci sweep ppo
#
# Replication grid for the Bayes sweep fpu947c0, which left both flanks of
# the good window [4e-3, 1.3e-2] contested: below 3e-3 two of four runs
# cratered (fat tail or bad luck?), and at 2e-2 the bracketing runs
# disagreed. Six log-even β rungs (ratio 20^(1/5)) x three fresh seeds
# (disjoint from that sweep's 0-2) measure the per-β spread directly.

method: grid
run_cap: 18
metric:
  name: "eval/thput"
  goal: maximize

parameters:
  divergence_penalty:
    values:
      - 0.001
      - 0.00182
      - 0.00331
      - 0.00603
      - 0.011
      - 0.02
  seed:
    values:
      - 4
      - 5
      - 6

program: ppo.py

command:
  - ${env}
  - python
  - ${program}
  - --start-from
  - h76h80yb
  - --total-timesteps
  - 5_000_000
  - --track
  - ${args}
