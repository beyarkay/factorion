# ci/sweep_ppo.yaml — β for the KL-to-SFT-reference penalty (#237)
#
# Launched with: /ci sweep ppo
#
# Every run finetunes the canonical SFT base for 5M steps; swept are
# divergence_penalty (β on the KL(π_θ ‖ π_ref) anchor; 0 = penalty off, the
# control arm) and the seed, so every β gets the same 3 seeds. run_cap
# matches the 6x3 grid exactly.

method: grid
run_cap: 18
metric:
  name: "eval/thput"
  goal: maximize

parameters:
  divergence_penalty:
    values:
      - 0.0
      - 0.005
      - 0.01
      - 0.02
      - 0.05
      - 0.1
  seed:
    values:
      - 1
      - 2
      - 3

program: ppo.py

command:
  - ${env}
  - python
  - ${program}
  - --start-from
  - h76h80yb
  - --total-timesteps
  - 5_000_000
  - --track
  - ${args}
