# ci/sweep_ppo.yaml — PPO finetune of an SFT base: where in the non-collapsing region it improves most.
#
# Launched with: /ci sweep ppo
# Sweep results are reported (ci sweep-report), not auto-applied —
# hyperparameter defaults live in training_config.py and are edited by hand.
#
# Before launching, refresh the --start-from base below: check W&B for the
# latest + longest-running SFT run that uploaded a model artifact (runs
# without one can't be loaded as a base, and beware PR-experiment runs such
# as single-lesson trains — their val/thput@8 is not comparable).
#
# Ranges from the 40-run random screen m5efstjq (500k steps from mvbipbr0),
# read off random-forest + ARD-GP partial dependence on its final
# eval/thput@8 and on late-run rollout/thput (the cleaner target: it averages
# hundreds of episodes). No run collapsed, and the 8 that barely moved agree
# to 0.463 ± 0.006, so gains of 0.02-0.04 clear eval noise, but the models explain
# little (CV R^2 0.1-0.2), so each range stays ~2x wider than its good band:
#   - target_kl (most important on both targets): good from ~0.013 and still
#     rising at the screen's 0.05 ceiling, so the range goes past it.
#   - update_epochs: good from ~3, still rising at 8.
#   - learning_rate: peaks at 5e-6-1e-5 on rollout/thput, flat on eval.
#   - ent_coef_start: lower is better and flat below ~5e-4, so the floor drops
#     below the screen's.
# Pinned: divergence_penalty (no consistent signal; a mid-range anchor for the
# longer horizon), num_steps (importance ~0.02), and the screen's short
# warmups. A final eval at 12 factories per lesson, plus one at mid-run.

method: bayes
run_cap: 30
metric:
  name: "eval/thput@8"  # @ training_config eval_best_of
  goal: maximize

parameters:
  lr_warmup_iters:
    value: 5
  critic_warmup:
    value: 5
  ent_coef_end:
    value: 0.0
  num_steps:
    value: 256
  divergence_penalty:
    value: 0.05
  eval_every:
    value: 122
  eval_seeds_per_kind:
    value: 12

  learning_rate:
    distribution: log_uniform_values
    min: 1.5e-6
    max: 3.0e-5
  update_epochs:
    distribution: int_uniform
    min: 3
    max: 12
  target_kl:
    distribution: log_uniform_values
    min: 0.01
    max: 0.1
  ent_coef_start:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 1.0e-3

program: ppo.py

command:
  - ${env}
  - python
  - ${program}
  - --start-from
  - mvbipbr0
  - --total-timesteps
  - 1_000_000
  - --track
  - ${args}
