# ci/sweep_ppo.yaml — peaks + shape of the independent actor/critic WSD LR envelopes
#
# Launched with: /ci sweep ppo
# Sweep results are reported (ci sweep-report), not auto-applied —
# hyperparameter defaults live in training_config.py and are edited by hand.
#
# Everything but the two LR envelopes stays at the training_config.py defaults;
# the sweep picks the peaks and the shape knobs the envelopes added:
#   - learning_rate: the peak the actor's stable phase holds for most of the
#     run, so the single most consequential number here. The previous default
#     was tuned under the linear whole-run anneal, which spends most of its
#     steps well below peak — the best WSD peak may well sit lower, so the
#     range reaches further down than up.
#   - critic_lr_mult: the critic's peak, relative to the actor's. Only the
#     value head rides it, so the range is wide.
#   - *_warmup_iters: absolute iteration counts, so what wins transfers
#     unchanged to runs of any length. The critic already trains at peak
#     through the critic_warmup freeze; 0 is in range so the sweep can say
#     the post-unfreeze ramps are worthless.
#   - *_cooldown_frac: Hägele et al. report the benefit plateauing near 20%
#     and as little as 5% sufficing on long runs; swept past both ends.
#   - *_min_ratio: 0 (decay to zero) is in range, so the sweep can tell us
#     whether a nonzero floor is worth anything. The critic's range reaches
#     higher — keeping the value head learning while the actor cools is the
#     point of scheduling the two independently.
#
# 1M timesteps ≈ 244 iterations (~1 h/run): long enough that the stable phase
# and the cooldown both register in eval/thput, short enough that 25 bayes
# runs drain in about a pod-day.

method: bayes
run_cap: 25
metric:
  name: "eval/thput"
  goal: maximize

parameters:
  # ── Peaks ────────────────────────────────────────────────────────
  learning_rate:
    distribution: log_uniform_values
    min: 3e-6
    max: 1e-4
  critic_lr_mult:
    distribution: log_uniform_values
    min: 0.25
    max: 8.0

  # ── Warmup ───────────────────────────────────────────────────────
  lr_warmup_iters:
    distribution: int_uniform
    min: 0
    max: 40
  critic_lr_warmup_iters:
    distribution: int_uniform
    min: 0
    max: 40

  # ── Cooldown ─────────────────────────────────────────────────────
  lr_cooldown_frac:
    distribution: uniform
    min: 0.02
    max: 0.5
  critic_lr_cooldown_frac:
    distribution: uniform
    min: 0.02
    max: 0.5
  lr_min_ratio:
    distribution: uniform
    min: 0.0
    max: 0.1
  critic_lr_min_ratio:
    distribution: uniform
    min: 0.0
    max: 0.3

program: ppo.py

command:
  - ${env}
  - python
  - ${program}
  - --start-from
  - h76h80yb
  - --total-timesteps
  - 1_000_000
  - --track
  - ${args}
