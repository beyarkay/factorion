# Loops in the flow graph, with the rates measured in headless Factorio 2.0.

description: |
  A splitter sends one output to the sink and loops the other back to
  sideload onto its own input belt. The source keeps both lanes of that belt
  full, and a sideload only fills gaps, so the loop backs up and the splitter
  sends everything to the sink: 15 i/s.
items:
- { x: 0, y: 2, item: iron_plate }
- { x: 6, y: 2, item: iron_plate }
throughput:
- { item: iron_plate, per_second: 15 }
factory: |
  .. .. .. .. .. .. ..
  .. .. .. .. .. .. ..
  S> b> b> b> Y> b> K>
  .. .. b^ .. Y> bv ..
  .. .. b^ b< b< b< ..
