description: |
  The same shared-inserter feed with the arithmetic stripped down:
  copper_cable curves onto both lanes of the south belt then sideloads onto
  the west belt's right lane, iron_plate feeds that belt in-line, and one
  inserter carries both into an electronic_circuit assembler (3 cable : 1
  plate). The even split hands over 0.43 of each, so the cable-hungry side
  binds at 0.43/3 = 0.1433 circuits/s.
