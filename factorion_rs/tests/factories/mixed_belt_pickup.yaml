- { x: 0, y: 9, item: advanced_circuit }
- { x: 8, y: 0, item: steel_plate }
- { x: 10, y: 2, item: iron_gear_wheel }
- { x: 10, y: 4, item: battery }
- { x: 5, y: 4, item: personal_roboport_equipment }   # assembler recipe (anchor = top-left)
- { x: 10, y: 9, item: personal_roboport_equipment }  # sink
