description: |
  A TRIAL_RECIPE_TREE_DEPTH_1 (personal_roboport, seed 22) grid as a policy
  built it: 22 entities, every one of them on a source→sink path.

  The recipe takes four ingredients but the build wires only three inserters
  into the assembler, so iron_gear_wheel and battery share the belt at (9,4):
  battery feeds it in-line from behind (both lanes), iron_gear_wheel arrives
  perpendicular from the north and sideloads onto the right lane alone.

  The inserter at (8,4) halves its 0.86 i/s over the two lanes, then halves
  the right lane's 0.43 again between the two items riding it — so battery
  collects 0.43 + 0.215 while gears get 0.215, and the gears bind at
  0.215/40 = 0.00538 roboports/s. Battery is over-supplied precisely because
  it occupies both lanes.

  Neither split may starve the other side: giving the whole swing to the
  in-line battery, or the whole right lane to the first item on it, scores
  this fully-connected factory zero.
items:
- { x: 0, y: 9, item: advanced_circuit }
- { x: 8, y: 0, item: steel_plate }
- { x: 10, y: 2, item: iron_gear_wheel }
- { x: 10, y: 4, item: battery }
- { x: 5, y: 4, item: personal_roboport }   # assembler recipe (anchor = top-left)
- { x: 10, y: 9, item: personal_roboport }  # sink
throughput:
- { item: personal_roboport, per_second: 0.005375 }
