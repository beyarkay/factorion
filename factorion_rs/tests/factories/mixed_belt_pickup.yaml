description: |
  A TRIAL_RECIPE_TREE_DEPTH_1 (personal_roboport, seed 22) grid as a policy
  built it: 22 entities, every one of them on a source→sink path.

  The recipe takes four ingredients but the build wires only three inserters
  into the assembler, so iron_gear_wheel and battery share the belt at (9,4):
  battery feeds it in-line from behind (both lanes), iron_gear_wheel arrives
  perpendicular from the north and sideloads onto the right lane alone. The
  inserter at (8,4) reaches across both lanes and splits its 0.86 i/s evenly,
  so 0.43 i/s of each ingredient reaches the assembler and battery — needed
  40% more often than gears — is what binds: 0.43/45 = 0.00956 roboports/s.

  Sharing one inserter costs about half the 0.0191 i/s that four dedicated
  inserters reach. It must not cost everything: a lane-priority pickup would
  spend the whole swing on the in-line battery, starve the gears, and score a
  fully-connected factory zero.
items:
- { x: 0, y: 9, item: advanced_circuit }
- { x: 8, y: 0, item: steel_plate }
- { x: 10, y: 2, item: iron_gear_wheel }
- { x: 10, y: 4, item: battery }
- { x: 5, y: 4, item: personal_roboport }   # assembler recipe (anchor = top-left)
- { x: 10, y: 9, item: personal_roboport }  # sink
