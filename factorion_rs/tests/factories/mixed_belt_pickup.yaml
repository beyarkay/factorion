description: |
  A TRIAL_RECIPE_TREE_DEPTH_1 (personal_roboport_equipment, seed 22) grid as a policy
  built it: 22 entities, every one of them on a source→sink path.

  The recipe takes four ingredients but the build wires only three inserters
  into the assembler, so iron_gear_wheel and battery share the belt at (9,4):
  battery feeds it in-line from behind (both lanes), iron_gear_wheel arrives
  perpendicular from the north and sideloads onto the right lane alone.

  The assembler refuses an ingredient it already holds enough of, so the
  inserter at (8,4) fills in the recipe's 40 gears : 45 batteries from both
  lanes at once: its 0.86 i/s is 0.86/85 = 0.0101 roboports/s.

  In Factorio this jams to zero: the batteries the machine refuses back up
  the right lane, so no gear can sideload onto it. The engine does not model
  a lane jammed by an item nobody drains (a known divergence).
items:
- { x: 0, y: 9, item: advanced_circuit }
- { x: 8, y: 0, item: steel_plate }
- { x: 10, y: 2, item: iron_gear_wheel }
- { x: 10, y: 4, item: battery }
- { x: 5, y: 4, item: personal_roboport_equipment }   # assembler recipe (anchor = top-left)
- { x: 10, y: 9, item: personal_roboport_equipment }  # sink
