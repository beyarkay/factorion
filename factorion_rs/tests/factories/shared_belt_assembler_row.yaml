description: |
  The third approach: each source runs north onto its own belt, curves
  inward, and sideloads onto the column from opposite sides. Two curves and
  two sideloads instead of two bare sideloads, and again 0.43/s — the curves
  preserve lanes, so the mix arriving at every inserter is unchanged.
