description: |
  Three assemblers drinking two ingredients off ONE shared belt. The two
  sources sideload onto opposite sides of the northbound column at x=2 —
  copper_cable from the west onto its left lane, iron_plate from the east
  onto its right. An assembler refuses an ingredient it already holds
  enough of, so each machine's lone input inserter reaches both lanes and
  fills in the recipe's 3 cable : 1 plate: 0.86 i/s is 0.215 circuits/s per
  machine, and three of them put 0.645/s into the sink.

  The column is nowhere near its 7.5/lane cap and the three pickups only
  draw 0.86 each, so the whole row is inserter-limited: an assembler pays
  for sharing the belt with its neighbours only through the hand, never
  through the belt.
items:
- { x: 0, y: 9, item: copper_cable }
- { x: 2, y: 9, item: iron_plate }
- { x: 4, y: 0, item: electronic_circuit }   # assembler recipes (anchor = top-left)
- { x: 4, y: 3, item: electronic_circuit }
- { x: 4, y: 6, item: electronic_circuit }
- { x: 8, y: 9, item: electronic_circuit }   # sink
throughput:
- { item: electronic_circuit, per_second: 0.645 }
factory: |
  .. .. b^ i> aaaaaaaa .. ..
  .. .. b^ .. aa    aa .. ..
  .. .. b^ .. aaaaaaaa i> bv
  .. E. b^ .. aaaaaaaa i> bv
  .. .. b^ .. aa    aa .. bv
  .. .. b^ i> aaaaaaaa E. bv
  .. .. b^ i> aaaaaaaa .. bv
  .. .. b^ .. aa    aa .. bv
  .. b> b^ .. aaaaaaaa i> bv
  S> b^ S< .. .. .. .. .. Kv
