description: |
  An inserter with no pole anywhere has no power, so it moves nothing.
simulate_power: true
items:
- { x: 0, y: 0, item: iron_plate }
- { x: 2, y: 0, item: iron_plate }
throughput:
- { item: iron_plate, per_second: 0 }
graph: ""
factory: |
  S> i> K>
