description: |
  A small pole beside the map edge reaches off the map, so its 5x5 supply
  area powers the inserter.
simulate_power: true
items:
- { x: 0, y: 1, item: iron_plate }
- { x: 2, y: 1, item: iron_plate }
throughput:
- { item: iron_plate, per_second: 0.86 }
graph: |
  S@0,1 -> i@1,1
  i@1,1 -> K@2,1
factory: |
  .. w. ..
  S> i> K>
