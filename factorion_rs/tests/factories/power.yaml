description: |
  An assembler needs power too. Both inserters are powered, but the small
  pole at (2,0) supplies rows 0..=2 and the one at (2,8) rows 6..=10, so no
  tile of the assembler (rows 3..=5) is powered and no gears are made.
simulate_power: true
items:
- { x: 2, y: 1, item: iron_plate }
- { x: 1, y: 3, item: iron_gear_wheel }
- { x: 2, y: 7, item: iron_gear_wheel }
throughput:
- { item: iron_gear_wheel, per_second: 0 }
