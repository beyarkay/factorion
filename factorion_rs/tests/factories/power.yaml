  .. .. w. .. ..
  .. .. Sv .. ..
  .. .. iv .. ..
  .. aaaaaaaa ..
  .. aa    aa ..
  .. aaaaaaaa ..
  .. .. iv .. ..
  .. .. Kv .. ..
  .. .. w. .. ..
