description: |
  Two items ride the two lanes of ONE belt — iron sideloaded onto the LEFT
  lane (from the north), copper onto the RIGHT lane (from the south) — and
  two inserters drain it. Inserters cannot unmix a belt: each reaches over
  both lanes and takes an even share, so both hands carry the same 50/50 mix
  of iron and copper regardless of which side they approach from. Each sink
  counts only its own item and sees half of the 0.86 i/s hand rate.
items:
- { x: 1, y: 0, item: iron_plate }     # north source → left lane
- { x: 1, y: 2, item: copper_plate }   # south source → right lane
- { x: 4, y: 1, item: iron_plate }     # in-line inserter's sink
- { x: 2, y: 3, item: copper_plate }   # perpendicular inserter's sink
throughput:
- { item: iron_plate, per_second: 0.43 }
- { item: copper_plate, per_second: 0.43 }
graph: |
  S@1,0 -> b@1,1:L
  S@1,2 -> b@1,1:R
  b@1,1:L -> b@2,1:L
  b@1,1:R -> b@2,1:R
  b@2,1:L -> i@3,1
  b@2,1:R -> i@3,1
  b@2,1:L -> i@2,2
  b@2,1:R -> i@2,2
  i@3,1 -> K@4,1
  i@2,2 -> K@2,3
factory: |
  .. Sv .. .. ..
  .. b> b> i> K>
  .. S^ iv .. ..
  .. .. Kv .. ..
