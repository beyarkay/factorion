description: |
  Two items ride the two lanes of ONE belt — iron sideloaded onto the LEFT
  lane (from the north), copper onto the RIGHT lane (from the south) — and
  two inserters drain it. A hand fills from its near lane first and only
  reaches across when that lane runs dry: the in-line inserter's near lane
  is the belt's left (iron), the perpendicular one's the lane on its side
  (copper). Neither lane runs dry, so each hand carries only its own sink's
  item at the full 0.86 i/s.
items:
- { x: 1, y: 0, item: iron_plate }     # north source → left lane
- { x: 1, y: 2, item: copper_plate }   # south source → right lane
- { x: 4, y: 1, item: iron_plate }     # in-line inserter's sink
- { x: 2, y: 3, item: copper_plate }   # perpendicular inserter's sink
throughput:
- { item: iron_plate, per_second: 0.86 }
- { item: copper_plate, per_second: 0.86 }
graph: |
  S@1,0 -> b@1,1:L
  S@1,2 -> b@1,1:R
  b@1,1:L -> b@2,1:L
  b@1,1:R -> b@2,1:R
  b@2,1:L -> i@3,1
  b@2,1:R -> i@3,1
  b@2,1:L -> i@2,2
  b@2,1:R -> i@2,2
  i@3,1 -> K@4,1
  i@2,2 -> K@2,3
factory: |
  .. Sv .. .. ..
  .. b> b> i> K>
  .. S^ iv .. ..
  .. .. Kv .. ..
---
description: |
  The in-line case from the other end: the inserter sits at the belt's aft,
  picking against the flow, and its near lane is still the belt's left.
  Iron comes off at the full hand rate and copper not at all.
items:
- { x: 2, y: 0, item: iron_plate }     # north source → left lane
- { x: 2, y: 2, item: copper_plate }   # south source → right lane
- { x: 0, y: 1, item: iron_plate }
throughput:
- { item: iron_plate, per_second: 0.86 }
factory: |
  .. .. Sv
  K< i< b>
  .. .. S^
